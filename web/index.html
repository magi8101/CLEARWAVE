<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLEARWAVE Live</title>
<style>
  :root { --bg:#0b1118; --panel:#121b26; --line:#223042; --fg:#e6eef7; --dim:#8aa0b6; --ok:#3ddc97; --warn:#ffb84d; --bad:#ff6b6b; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap }
  h1 { font-size:18px; margin:0; letter-spacing:.08em }
  #status { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:14px }
  #dot { width:10px; height:10px; border-radius:50%; background:var(--warn) }
  main { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:16px; padding:16px; max-width:1200px; margin:0 auto }
  @media (max-width:820px) { main { grid-template-columns:1fr } }
  .view { background:#000; border:1px solid var(--line); border-radius:8px; overflow:hidden; aspect-ratio:4/3; position:relative }
  canvas { width:100%; height:100%; display:block }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--dim); white-space:pre-line }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:14px; align-self:start }
  label { display:block; color:var(--dim); font-size:13px; margin-bottom:4px }
  input[type=range] { width:100% }
  input[type=text] { width:100%; padding:8px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px }
  button { padding:8px 12px; background:#1c2a3a; color:var(--fg); border:1px solid var(--line); border-radius:6px; cursor:pointer; font:inherit }
  button:hover { background:#25374c }
  .row { display:flex; gap:8px }
  #counts div { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid var(--line) }
  small { color:var(--dim) }
</style>
</head>
<body>
<header>
  <h1>CLEARWAVE</h1>
  <div id="status"><span id="dot"></span><span id="stext">starting...</span></div>
</header>
<main>
  <div class="view">
    <canvas id="cv" width="640" height="480"></canvas>
    <div id="msg">Loading model...</div>
  </div>
  <aside>
    <div>
      <label>Confidence: <b id="cval">0.25</b></label>
      <input id="conf" type="range" min="0.05" max="0.9" step="0.01" value="0.25">
    </div>
    <div>
      <label>Camera address (blank = auto-find)</label>
      <div class="row"><input id="host" type="text" placeholder="esp32cam.local or 192.168.x.x"><button id="go">Set</button></div>
    </div>
    <div class="row"><button id="rescan">Find camera again</button></div>
    <div id="counts"><small>No detections</small></div>
    <small id="info"></small>
  </aside>
</main>

<script src="ort/ort.min.js"></script>
<script>
"use strict";
const MODEL = "../models/clearwave-4class.onnx";
const NAMES = ["bottle", "can", "plastic", "wrapper"];
const COLORS = ["#3ddc97", "#4da3ff", "#ffb84d", "#d17bff"];
const SIZE = 640, IOU = 0.45;
// Common home / phone-hotspot subnets scanned when the saved address and esp32cam.local both fail.
const SUBNETS = ["192.168.43", "192.168.0", "192.168.1", "172.20.10", "192.168.137", "192.168.2", "10.0.0", "192.168.100"];

const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d", { willReadFrequently: true });
const work = new OffscreenCanvas(SIZE, SIZE), wctx = work.getContext("2d", { willReadFrequently: true });
let session = null, cam = null, scanning = false, manual = "", fps = 0;

function setStatus(color, text) { $("dot").style.background = color; $("stext").textContent = text; }
let modelFailed = false;
function showMsg(t) { if (modelFailed) return; $("msg").style.display = t ? "flex" : "none"; $("msg").textContent = t || ""; }
const store = {
  get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

// ---- camera discovery -------------------------------------------------
async function probe(host, ms = 1500) {
  try {
    const r = await fetch(`http://${host}/status`, { signal: AbortSignal.timeout(ms), cache: "no-store" });
    const j = await r.json();
    return "framesize" in j;
  } catch { return false; }
}

// The laptop's own /24 first: web/serve.py reports it at /lan (a page can't read its own IP otherwise).
async function lanBase() {
  try {
    const j = await (await fetch("/lan", { signal: AbortSignal.timeout(1500), cache: "no-store" })).json();
    if (j.ip) return j.ip.split(".").slice(0, 3).join(".");
  } catch {}
  return /^\d+\.\d+\.\d+\.\d+$/.test(location.hostname) ? location.hostname.split(".").slice(0, 3).join(".") : null;
}

async function scanSubnets() {
  const bases = [await lanBase(), ...SUBNETS].filter((b, i, a) => b && a.indexOf(b) === i);
  const hosts = [];
  for (const s of bases) for (let i = 1; i < 255; i++) hosts.push(`${s}.${i}`);
  let found = null, next = 0;
  async function worker() {
    while (!found && next < hosts.length) {
      const h = hosts[next++];
      if (next % 100 === 0) setStatus("var(--warn)", `scanning ${h}...`);
      if (await probe(h, 1500)) { found = h; }  // the ESP32 takes ~0.8 s to answer; a shorter timeout misses it
    }
  }
  await Promise.all(Array.from({ length: 64 }, worker));
  return found;
}

async function findCamera() {
  if (scanning) return;
  scanning = true; cam = null;
  setStatus("#ffb84d", "looking for camera...");
  showMsg("Looking for the ESP32-CAM...\nYour laptop must be on the same WiFi as the camera.");
  let host = null;
  const tries = [manual, store.get("cam"), "esp32cam.local"].filter(Boolean);
  for (const h of tries) { if (await probe(h)) { host = h; break; } }
  if (!host && !manual) host = await scanSubnets();
  scanning = false;
  if (!host) {
    setStatus("#ff6b6b", "camera not found, retrying...");
    setTimeout(findCamera, 3000);
    return;
  }
  cam = host; store.set("cam", host);
  fetch(`http://${host}/control?var=framesize&val=8`).catch(() => {});  // VGA; the camera resets to QVGA on reboot
  setStatus("#3ddc97", `connected: ${host}`);
  showMsg("");
}

// ---- model --------------------------------------------------------------
async function loadModel() {
  ort.env.wasm.wasmPaths = new URL("ort/", location.href).href;  // must be absolute: import() treats "ort/" as a package name
  ort.env.wasm.numThreads = 1;  // multi-thread needs cross-origin isolation headers; simple servers don't send them
  session = await ort.InferenceSession.create(MODEL, { executionProviders: ["webgpu", "wasm"] });
  $("info").textContent = "Model loaded. Running on this device only; no frames leave your network.";
}

function iou(a, b) {
  const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);
  const x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  return inter / (a.w * a.h + b.w * b.h - inter + 1e-9);
}

function decode(out, conf, scale, padX, padY) {
  // out: [1, 4+nc, N] -> boxes cx,cy,w,h in letterboxed 640 space, then per-class scores
  const N = out.dims[2], nc = out.dims[1] - 4, d = out.data, cand = [];
  for (let i = 0; i < N; i++) {
    let best = 0, bs = 0;
    for (let c = 0; c < nc; c++) { const s = d[(4 + c) * N + i]; if (s > bs) { bs = s; best = c; } }
    if (bs < conf) continue;
    const cx = d[i], cy = d[N + i], w = d[2 * N + i], h = d[3 * N + i];
    cand.push({ x: (cx - w / 2 - padX) / scale, y: (cy - h / 2 - padY) / scale, w: w / scale, h: h / scale, s: bs, c: best });
  }
  cand.sort((a, b) => b.s - a.s);
  const keep = [];
  for (const b of cand) if (!keep.some(k => k.c === b.c && iou(k, b) > IOU)) keep.push(b);
  return keep;
}

async function infer(bmp, conf) {
  const scale = Math.min(SIZE / bmp.width, SIZE / bmp.height);
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const padX = (SIZE - w) / 2, padY = (SIZE - h) / 2;
  wctx.fillStyle = "rgb(114,114,114)"; wctx.fillRect(0, 0, SIZE, SIZE);
  wctx.drawImage(bmp, padX, padY, w, h);
  const px = wctx.getImageData(0, 0, SIZE, SIZE).data, plane = SIZE * SIZE, t = new Float32Array(3 * plane);
  for (let i = 0; i < plane; i++) { t[i] = px[4 * i] / 255; t[plane + i] = px[4 * i + 1] / 255; t[2 * plane + i] = px[4 * i + 2] / 255; }
  const res = await session.run({ [session.inputNames[0]]: new ort.Tensor("float32", t, [1, 3, SIZE, SIZE]) });
  return decode(res[session.outputNames[0]], conf, scale, padX, padY);
}

function draw(bmp, dets) {
  if (cv.width !== bmp.width) { cv.width = bmp.width; cv.height = bmp.height; }
  ctx.drawImage(bmp, 0, 0);
  ctx.lineWidth = Math.max(2, bmp.width / 320); ctx.font = `${Math.round(bmp.width / 36)}px system-ui`;
  for (const b of dets) {
    ctx.strokeStyle = ctx.fillStyle = COLORS[b.c % COLORS.length];
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    const label = `${NAMES[b.c] ?? b.c} ${(b.s * 100) | 0}%`, tw = ctx.measureText(label).width + 8, th = parseInt(ctx.font) + 6;
    ctx.fillRect(b.x, Math.max(0, b.y - th), tw, th);
    ctx.fillStyle = "#000"; ctx.fillText(label, b.x + 4, Math.max(th - 6, b.y - 6));
  }
}

function counts(dets) {
  const n = {}; for (const b of dets) n[NAMES[b.c]] = (n[NAMES[b.c]] || 0) + 1;
  $("counts").innerHTML = Object.keys(n).length
    ? Object.entries(n).map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")
    : "<small>No detections</small>";
}

// ---- main loop ----------------------------------------------------------
async function loop() {
  let fails = 0;
  for (;;) {
    if (!session || !cam) { await new Promise(r => setTimeout(r, 300)); continue; }
    const t0 = performance.now();
    try {
      const r = await fetch(`http://${cam}/capture?_cb=${Date.now()}`, { cache: "no-store", signal: AbortSignal.timeout(4000) });
      if (!r.ok) throw new Error("http " + r.status);
      const bmp = await createImageBitmap(await r.blob());
      const dets = await infer(bmp, +$("conf").value);
      draw(bmp, dets); counts(dets); bmp.close();
      fails = 0;
      fps = 0.8 * fps + 0.2 * (1000 / (performance.now() - t0));
      setStatus("#3ddc97", `connected: ${cam}  ·  ${fps.toFixed(1)} fps`);
    } catch (e) {
      if (++fails >= 3) { setStatus("#ff6b6b", "lost camera"); findCamera(); fails = 0; }
      await new Promise(r => setTimeout(r, 500));
    }
  }
}

// ---- UI + network-change hooks -----------------------------------------
$("conf").oninput = () => $("cval").textContent = (+$("conf").value).toFixed(2);
$("go").onclick = () => { manual = $("host").value.trim(); store.set("cam", ""); findCamera(); };
$("rescan").onclick = () => { manual = ""; $("host").value = ""; findCamera(); };
// A WiFi switch fires these: look for the camera again on the new network.
addEventListener("online", () => { cam = null; findCamera(); });
navigator.connection?.addEventListener("change", () => { cam = null; findCamera(); });

loadModel()
  .then(() => { $("msg").textContent = "Looking for the ESP32-CAM..."; })
  .catch(e => { window.modelError = String(e && (e.stack || e.message || e)); console.error(window.modelError); modelFailed = true; showMsg("Model failed to load:\n" + (e.message || e)); setStatus("#ff6b6b", "model error"); });
findCamera();
loop();
</script>
</body>
</html>
